<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>SelarasKas - Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; }
        .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }
        .stat-card .val { font-size: 32px; font-weight: 700; color: var(--color-primary); }
        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(255,255,255,0.05); font-weight: 600; color: var(--text-muted); }
        .tier-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .tier-free { background: rgba(148,163,184,0.2); color: #cbd5e1; }
        .tier-premium { background: rgba(16,185,129,0.2); color: #10b981; }
        .tier-pro { background: rgba(245,158,11,0.2); color: #f59e0b; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>SelarasKas Superadmin</h1>
            <a href="index.html" class="outline-btn" style="text-decoration:none;">Kembali ke App</a>
        </div>
        
        <div class="stat-grid" id="statGrid">
            <div class="stat-card"><h3>Total Users</h3><div class="val" id="statUsers">...</div></div>
            <div class="stat-card"><h3>Premium / Pro</h3><div class="val" id="statPaid">...</div></div>
            <div class="stat-card"><h3>Total Wallets</h3><div class="val" id="statWallets">...</div></div>
            <div class="stat-card"><h3>Total Transactions</h3><div class="val" id="statTx">...</div></div>
        </div>
        
        <h2>Recent Users</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Email</th>
                    <th>Tier</th>
                    <th>Terdaftar</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('api/admin.php?action=stats');
                if (res.status === 403) {
                    alert('Akses Ditolak. Hanya admin (ID=1) yang bisa mengakses halaman ini.');
                    window.location.href = 'index.html';
                    return;
                }
                const data = await res.json();
                
                document.getElementById('statUsers').textContent = data.total_users;
                document.getElementById('statWallets').textContent = data.total_wallets;
                document.getElementById('statTx').textContent = data.total_transactions;
                
                let paid = 0;
                data.tiers.forEach(t => {
                    if (t.subscription_tier !== 'free') paid += parseInt(t.count);
                });
                document.getElementById('statPaid').textContent = paid;
                
                const resU = await fetch('api/admin.php?action=users');
                const dataU = await resU.json();
                
                const tbody = document.getElementById('userTable');
                tbody.innerHTML = dataU.users.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td><span class="tier-badge tier-${u.subscription_tier}">${u.subscription_tier}</span></td>
                        <td>${u.created_at}</td>
                    </tr>
                `).join('');
                
            } catch(e) {
                console.error(e);
            }
        }
        loadAdminData();
    </script>
</body>
</html>
